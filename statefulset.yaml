apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ethereum-node
  namespace: default
spec:
  serviceName: ethereum-node
  replicas: 1
  selector:
    matchLabels:
      app: ethereum-node
  template:
    metadata:
      labels:
        app: ethereum-node
    spec:
      containers:
      - name: execution
        image: nginx
        ports:
        - containerPort: 8545
          name: rpc
        - containerPort: 30303
          name: p2p
        volumeMounts:
        - name: chain-data
          mountPath: /data/ethereum
        env:
        - name: NETWORK
          valueFrom:
            configMapKeyRef:
              name: ethereum-config
              key: network
  volumeClaimTemplates:
  - metadata:
      name: chain-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ethereum-node
  namespace: default
spec:
  clusterIP: None
  selector:
    app: ethereum-node
  ports:
  - port: 8545
    name: rpc
  - port: 30303
    name: p2p
